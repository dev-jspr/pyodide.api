name: Download Pyodide

# Allow the job to push files back to the repository
permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  download-pyodide:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: 0.23.4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ensure the action keeps GITHUB_TOKEN credentials so git push can authenticate
          persist-credentials: true

      - name: Download Pyodide (release tarball candidates)
        run: |
          set -euo pipefail

          RELEASE_TAG="${RELEASE_TAG:-0.23.4}"
          TARBALL_CANDIDATES=( "pyodide-${RELEASE_TAG}.tar.bz2" "pyodide-v${RELEASE_TAG}.tar.bz2" )
          GH_BASE="https://github.com/pyodide/pyodide/releases/download/${RELEASE_TAG}"
          CDN_BASE="https://cdn.jsdelivr.net/pyodide/v${RELEASE_TAG}/full"
          FILES=(pyodide.js pyodide.wasm pyodide_py.tar packages.json)

          echo "Trying GitHub release tarball(s)..."
          for t in "${TARBALL_CANDIDATES[@]}"; do
            GH_URL="${GH_BASE}/${t}"
            echo "Attempting: $GH_URL"
            if curl -fSL "$GH_URL" -o "$t"; then
              TARBALL="$t"
              echo "Downloaded $t"
              break
            fi
          done

          if [ -n "${TARBALL:-}" ]; then
            echo "Extracting $TARBALL..."
            mkdir -p pyodide-extract
            tar -xjf "$TARBALL" -C pyodide-extract

            # Debug: show a sample of extracted tree
            echo "Extracted tree (first 300 lines):"
            find pyodide-extract -maxdepth 6 -print | sed -n '1,300p' || true

            # For each expected file, search anywhere under pyodide-extract and copy the first match
            for f in "${FILES[@]}"; do
              src=$(find pyodide-extract -type f -name "$f" -print -quit || true)
              if [ -n "$src" ]; then
                echo "Found $f at $src — copying to repo root"
                cp "$src" .
              else
                echo "Warning: $f not found under pyodide-extract"
              fi
            done
          else
            echo "Release tarball not available on GitHub; falling back to CDN: $CDN_BASE"
            for f in "${FILES[@]}"; do
              echo "Downloading $f from CDN..."
              curl -L --fail "$CDN_BASE/$f" -o "$f"
            done
          fi

          echo "Downloaded file stat (if present):"
          for f in "${FILES[@]}"; do
            if [ -f "$f" ]; then
              echo "  $f: exists, size=$(stat -c%s "$f") bytes"
            else
              echo "  $f: missing"
            fi
          done

      - name: Debug before commit
        run: |
          echo "Working directory: $(pwd)"
          echo "Remote origin:"
          git remote -v || true
          echo "Git status (porcelain):"
          git status --porcelain --untracked-files=all || true
          echo "Untracked files (git ls-files --others):"
          git ls-files --others --exclude-standard || true
          echo "List repo root (first 200 lines):"
          ls -lah | sed -n '1,200p' || true
          echo ".gitignore (if present):"
          [ -f .gitignore ] && sed -n '1,200p' .gitignore || echo ".gitignore not present"

      - name: Prepare files for commit (skip very large files)
        run: |
          set -euo pipefail
          MAX_BYTES=95000000   # 95 MB safety threshold (GitHub rejects >100MB)
          FILES=(pyodide.js pyodide.wasm pyodide_py.tar packages.json)
          # Build a list of files to add
          TO_ADD=()
          for f in "${FILES[@]}"; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f")
              if [ "$size" -ge "$MAX_BYTES" ]; then
                echo "Warning: $f is ${size} bytes and exceeds the safety threshold (${MAX_BYTES}). Skipping add. Consider Git LFS or external storage."
              else
                echo "Queuing $f for git add (size=${size})"
                TO_ADD+=("$f")
              fi
            else
              echo "Skipping $f: not present"
            fi
          done

          # Expose TO_ADD to the next step via temporary file
          if [ "${#TO_ADD[@]}" -gt 0 ]; then
            printf "%s\n" "${TO_ADD[@]}" > files-to-add.txt
            cat files-to-add.txt
          else
            echo "No files to add"
            touch files-to-add.txt
          fi

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Read files-to-add.txt and add existing entries
          if [ -f files-to-add.txt ]; then
            while IFS= read -r f || [ -n "$f" ]; do
              if [ -n "$f" ] && [ -f "$f" ]; then
                echo "Adding $f..."
                git add "$f"
              fi
            done < files-to-add.txt
          fi

          # Commit only if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Pyodide files (RELEASE_TAG=${RELEASE_TAG})"
            echo "Pushing commits..."
            git push
          fi

      - name: Final listing
        if: always()
        run: |
          echo "Final repo root listing:"
          ls -lah | sed -n '1,200p' || true
          echo "Done."
