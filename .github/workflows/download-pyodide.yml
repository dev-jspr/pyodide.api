      - name: Download Pyodide files
        run: |
          set -euo pipefail
          INDEX_URL="https://cdn.jsdelivr.net/pyodide/v0.23.4/full"
          FILES=(pyodide.js pyodide.wasm pyodide_py.tar packages.json)
          for f in "${FILES[@]}"; do
            echo "Downloading $f..."
            curl -L --fail "$INDEX_URL/$f" -o "$f"
            ls -lh "$f"
          done
