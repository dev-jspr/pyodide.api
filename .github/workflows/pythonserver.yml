name: Python API Server

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-api-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors pyngrok
      
      - name: Create Flask API Server with ngrok
        run: |
          cat > api_server.py << 'EOF'
          from flask import Flask, request, jsonify
          from flask_cors import CORS
          from pyngrok import ngrok
          import time
          
          app = Flask(__name__)
          CORS(app)
          
          @app.route('/', methods=['POST'])
          def execute_code():
              try:
                  data = request.get_json()
                  code = data.get('code')
                  
                  if not code:
                      return jsonify({"error": "No 'code' field provided"}), 400
                  
                  output_buffer = []
                  namespace = {
                      'print': lambda *args, **kwargs: output_buffer.append(' '.join(map(str, args))),
                      '__builtins__': __builtins__
                  }
                  
                  exec(code, namespace)
                  output = '\n'.join(output_buffer) if output_buffer else ''
                  
                  return jsonify({
                      "success": True,
                      "output": output,
                      "code": code
                  }), 200
              
              except Exception as err:
                  return jsonify({
                      "success": False,
                      "error": str(err),
                      "error_type": type(err).__name__
                  }), 500
          
          @app.route('/api', methods=['GET'])
          def api_info():
              return jsonify({
                  "name": "Pyodide Python API",
                  "description": "Execute Python code via HTTP"
              }), 200
          
          if __name__ == '__main__':
              import threading
              server_thread = threading.Thread(target=lambda: app.run(host='0.0.0.0', port=8080, debug=False), daemon=True)
              server_thread.start()
              
              time.sleep(2)
              
              print("Starting ngrok tunnel...")
              public_url = ngrok.connect(8080)
              print(f"\n{'='*70}")
              print(f"PUBLIC API URL: {public_url}")
              print(f"{'='*70}\n")
              
              try:
                  while True:
                      time.sleep(1)
              except KeyboardInterrupt:
                  ngrok.kill()
          EOF
          
          python api_server.py
