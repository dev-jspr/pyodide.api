name: Python Server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors pyngrok
      
      - name: Create Flask API Server with ngrok
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          cat > api_server.py << 'EOF'
          from flask import Flask, request, jsonify
          from flask_cors import CORS
          from pyngrok import ngrok
          import os
          import sys
          import time
          import logging
          
          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger(__name__)
          
          # Set ngrok auth token
          auth_token = os.getenv('NGROK_AUTH_TOKEN')
          if not auth_token:
              logger.error("NGROK_AUTH_TOKEN not set!")
              sys.exit(1)
          
          ngrok.set_auth_token(auth_token)
          
          app = Flask(__name__)
          CORS(app)
          
          @app.route('/', methods=['POST'])
          def execute_code():
              try:
                  data = request.get_json()
                  code = data.get('code')
                  
                  if not code:
                      return jsonify({"error": "No 'code' field provided"}), 400
                  
                  output_buffer = []
                  namespace = {
                      'print': lambda *args, **kwargs: output_buffer.append(' '.join(map(str, args))),
                      '__builtins__': __builtins__
                  }
                  
                  exec(code, namespace)
                  output = '\n'.join(output_buffer) if output_buffer else ''
                  
                  return jsonify({
                      "success": True,
                      "output": output,
                      "code": code
                  }), 200
              
              except Exception as err:
                  logger.error(f"Error: {err}")
                  return jsonify({
                      "success": False,
                      "error": str(err),
                      "error_type": type(err).__name__
                  }), 500
          
          if __name__ == '__main__':
              import threading
              
              server_thread = threading.Thread(
                  target=lambda: app.run(host='127.0.0.1', port=8080, debug=False),
                  daemon=True
              )
              server_thread.start()
              time.sleep(2)
              
              try:
                  logger.info("Starting ngrok tunnel...")
                  public_url = ngrok.connect(8080)
                  logger.info(f"\n{'='*70}")
                  logger.info(f"PUBLIC API URL: {public_url}")
                  logger.info(f"{'='*70}\n")
                  
                  # Save URL to file for GitHub output
                  with open('/tmp/ngrok_url.txt', 'w') as f:
                      f.write(str(public_url))
                  
                  # Keep running
                  while True:
                      time.sleep(1)
              except Exception as e:
                  logger.error(f"ngrok connection failed: {e}")
                  sys.exit(1)
          EOF
          
          python api_server.py
      
      - name: Output ngrok URL
        if: success()
        run: |
          if [ -f /tmp/ngrok_url.txt ]; then
            URL=$(cat /tmp/ngrok_url.txt)
            echo "PUBLIC_API_URL=$URL" >> $GITHUB_OUTPUT
            echo "✅ API is live at: $URL"
          fi
        id: api_url
      
      - name: Comment PR with API URL
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.api_url.outputs.PUBLIC_API_URL }}';
            if (url) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🚀 Flask API Live\n\n**Public URL:** ${url}\n\nSend POST requests with \`{"code": "..."}\``
              });
            }
